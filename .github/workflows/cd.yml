name: CD

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # npm provenance
      contents: write # create releases and push changesets
      pull-requests: write # create changeset PRs
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The publish command stages on npm and tags the release. The action's
      # "published" output therefore means staged for approval, not live on npm.
      - name: Create Release Pull Request or Stage to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:stage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # DXT bundles local source, not the unpublished npm package.
      - name: Build DXT file
        if: steps.changesets.outputs.published == 'true'
        run: pnpm build:dxt

      - name: Upload DXT to GitHub Release
        if: steps.changesets.outputs.published == 'true'
        run: |
          gh release upload "v$VERSION" portone-mcp-server.dxt --clobber
          echo "npm: \`@portone/mcp-server@$VERSION\` is staged. Approve it with 2FA in the package's Staged Packages tab on npmjs.com or with \`npm stage approve <stage-id>\`." >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ fromJson(steps.changesets.outputs.publishedPackages)[0].version }}
